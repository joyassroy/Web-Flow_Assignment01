<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web-Flow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <section class="nav-banner-page">
        <nav class="nav-bar">
          <h2 class="nav-bar-logo inter-font">LOGO</h2>
          <button class="btn raleway-font">Sign Up</button>
        </nav>
        <div class="banner-section">
          <h2 class="banner-header raleway-font">
            Cool Dark UI Template for <br />
            Webflow Agencies!
          </h2>
          <button class="btn raleway-font">Stay Focused</button>
        </div>
      </section>
    </header>
    <main>
      <section class="action-section">
        <div class="action-section-container">
          <h2 class="action-section-header raleway-font">See It in Action</h2>
          <p class="action-section-description raleway-font">
            Explore the live preview and imagine your <br />
            brand in this bold new look.
          </p>
          <button class="btn">Launch Live Preview</button>
        </div>
        <img class="action-section-img1" src="/Assets/wc-mini.png" alt="" />
      </section>
      <section class="productive-user-section">
        <h2 class="productive-section-header1 raleway-font">
          Joined Thousands of Productive Users
        </h2>
        <div class="productive-section-container">
          <div class="productive-section-container-details">
            <h2 class="productive-section-header2 inter-font">50K</h2>
            <p class="productive-section-description inter-font">Active User</p>
          </div>
          <div class="productive-section-container-details">
            <h2 class="productive-section-header2 inter-font">2M+</h2>
            <p class="productive-section-description inter-font">Focus Sessions</p>
          </div>
          <div class="productive-section-container-details">
            <h2 class="productive-section-header2 inter-font">95%</h2>
            <p class="productive-section-description inter-font">Satisfaction Rate</p>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
